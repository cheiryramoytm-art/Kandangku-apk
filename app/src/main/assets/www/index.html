const AV = {

const SV = {}; function avatar(r){ return SV[r] || (SV[r] = (AV[r]||narrator)()); }


const $=id=>document.getElementById(id), audio=$('audio');
const title=s=>s.toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
function rolesOf(w){ w=w.trim(); if(/^semua$/i.test(w)) return ['SEMUA']; if(/^gembala$/i.test(w)) return ['Pak Yakob','Timo']; return w.split(/,|&/).map(x=>title(x.trim())).filter(Boolean); }
function bg(rs){
  if(rs[0]==='SEMUA') return 'linear-gradient(135deg,#FF5C8A,#FFB547 30%,#4CD3A5 55%,#4AA8FF 78%,#9B7BFF)';
  const cs=rs.map(r=>ROLES[r]||ROLES.Narator);
  return cs.length===1?`linear-gradient(160deg,${cs[0].c2},${cs[0].c})`:`linear-gradient(135deg,${cs.map(c=>c.c).join(',')})`;
}
let si=0, li=-2;
const sec=()=>DATA[si];
function show(i){
  if(i===li) return; li=i; const s=sec();
  const scr=$('screen');
  if(i<0){
    scr.style.background='linear-gradient(160deg,#7E6BD6,#3E2F86)';
    $('avs').className='avs'; $('avs').innerHTML='<div class="av">'+avatar('Narator')+'</div>';
    $('name').textContent=s.emoji+' '+s.title;
    $('txt').textContent= src(s)?(audio.paused?'Tekan ▶ untuk mulai':'🎶 Dengarkan…'):'Ketuk layar untuk lirik berikutnya';
  } else {
    const l=s.lines[i], rs=rolesOf(l.who);
    scr.style.background=bg(rs);
    const list=rs[0]==='SEMUA'?['Embe','Embi','Malaikat','Timo','Cilik']:rs;
    $('avs').className='avs'+(list.length>2?' many':'');
    $('avs').innerHTML=list.map(r=>'<div class="av">'+avatar(r)+'</div>').join('');
    $('name').textContent=title(l.who);
    $('txt').innerHTML=(l.part?'<span class="note">♪</span>':'')+l.text;
  }
  for(const el of [$('avs'),$('name'),$('txt')]){ el.classList.remove('anim'); void el.offsetWidth; el.classList.add('anim'); }
}
function lineAt(t){ const L=sec().lines; let k=-1; for(let i=0;i<L.length;i++){ if(L[i].t<=t+0.05) k=i; else break; } return k; }
function load(i, autoplay){
  si=(i+DATA.length)%DATA.length; const s=sec(); li=-2;
  $('title').textContent=`${si+1}/${DATA.length} · ${s.emoji} ${s.title}`;
  if(src(s)){ audio.src=src(s); audio.load(); if(autoplay) audio.play().catch(()=>{}); } else { audio.removeAttribute('src'); audio.load(); }
  $('play').textContent='▶'; $('prog').style.width='0'; show(-1);
}
audio.ontimeupdate=()=>{ const s=sec(); if(!src(s)) return; show(lineAt(audio.currentTime)); $('prog').style.width=(audio.currentTime/(s.duration||audio.duration||1)*100)+'%'; };
audio.onplay=()=>{ $('play').textContent='⏸'; if(li<0){ li=-2; show(-1); } };
audio.onpause=()=>$('play').textContent='▶';
audio.onended=()=>{ if(si<DATA.length-1) load(si+1,true); };
$('play').onclick=e=>{ e.stopPropagation(); const s=sec(); if(!src(s)){ manualNext(); return; } audio.paused?audio.play().catch(()=>{}):audio.pause(); };
$('prev').onclick=e=>{ e.stopPropagation(); load(si-1); };
$('next').onclick=e=>{ e.stopPropagation(); load(si+1); };
function manualNext(){ const s=sec(); if(li<s.lines.length-1){ show(li+1); $('prog').style.width=((li+1)/s.lines.length*100)+'%'; } else load(si+1); }
$('screen').onclick=()=>{ if(!src(sec())) manualNext(); };
document.onkeydown=e=>{ if(e.code==='Space'){ e.preventDefault(); $('play').click(); } if(e.code==='ArrowRight') $('next').click(); if(e.code==='ArrowLeft') $('prev').click(); };
/* ---------- audio loader (IndexedDB) ---------- */
function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('kandangku',1); r.onupgradeneeded=()=>r.result.createObjectStore('audio'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e)} }); }
async function idbPut(k,v){ try{ const db=await idb(); await new Promise((res,rej)=>{ const tx=db.transaction('audio','readwrite'); tx.objectStore('audio').put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} }
async function idbAll(){ try{ const db=await idb(); return await new Promise((res)=>{ const out={}; const tx=db.transaction('audio','readonly'); const st=tx.objectStore('audio'); const rq=st.openCursor(); rq.onsuccess=()=>{ const c=rq.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; rq.onerror=()=>res({}); }); }catch(e){ return {}; } }
function needAudio(){ return DATA.some(s=>s.audio && !src(s)); }
function refreshLoader(){
  const miss = DATA.filter(s=>s.audio && !src(s)).map(s=>s.emoji+' '+(s.title.split(' · ')[1]||s.title));
  $('loader').hidden = !miss.length;
  $('loadInfo').textContent = miss.length && Object.keys(BLOB).length ? 'Masih kurang: '+miss.join(', ') : '';
}
function matchFiles(files){
  const lagu = {}, dialog = [];
  [...files].forEach(f=>{ const m=f.name.match(/lagu[ _-]?(\d)/i); if(m) lagu['l'+m[1]]=f; else dialog.push(f); });
  const key = f => { const m=f.name.match(/(\d{10,})/); return m? +m[1] : f.lastModified; };
  dialog.sort((a,b)=>key(a)-key(b));
  const out = {...lagu};
  ['a1','a2','a3','a4','a5'].forEach((k,i)=>{ if(dialog[i]) out[k]=dialog[i]; });
  return out;
}

function refreshLoader(){ $('load').hidden = !DATA.some(s=>s.audio && !src(s)); }
function matchFiles(files){

}
$('files').onchange=async e=>{ const m=matchFiles(e.target.files); for(const [k,f] of Object.entries(m)){ if(!DATA.find(s=>s.id===k)) continue; BLOB[k]=URL.createObjectURL(f); await idbPut(k,f); } refreshLoader(); load(si); };
