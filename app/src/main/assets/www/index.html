  'Malaikat':       {c:'#E0A100', c2:'#FFE07A', kind:'Utusan Tuhan'},
  'Malaikat Kecil': {c:'#8B6CF0', c2:'#C9B8FF', kind:'Pendamping malaikat'},
  'Maria':          {c:'#3949AB', c2:'#8C9EFF', kind:'Ibu Yesus'},
  'Yusuf':          {c:'#00897B', c2:'#5FD3C4', kind:'Suami Maria'},
};

/* ---------- original SVG avatars ---------- */
function sheep(o){
  const wool = (o.wool||'#fff'), face=o.face||'#4E3B31', s=o.small?0.86:1;
  let acc='';
  if(o.acc==='crown') acc='<path d="M70 52 l10 -22 l12 16 l8 -20 l8 20 l12 -16 l10 22 z" fill="#FFD23F" stroke="#E0A100" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="40" r="4" fill="#E8457A"/>';
  if(o.acc==='bow') acc='<g transform="translate(100 168)"><path d="M0 0 L-26 -12 L-26 12 Z M0 0 L26 -12 L26 12 Z" fill="#0FA3B1" stroke="#087D88" stroke-width="3" stroke-linejoin="round"/><circle r="7" fill="#087D88"/></g>';
  if(o.acc==='grass') acc='<g stroke="#4CAF50" stroke-width="5" stroke-linecap="round"><path d="M118 140 l16 -8"/><path d="M118 142 l18 2"/><path d="M118 144 l14 10"/></g>';
  const blush = o.blush ? '<circle cx="74" cy="122" r="8" fill="#FF8FB1" opacity=".8"/><circle cx="126" cy="122" r="8" fill="#FF8FB1" opacity=".8"/>' : '';
  const brow = o.brow ? '<path d="M70 92 l18 6 M130 92 l-18 6" stroke="#2a1d18" stroke-width="5" stroke-linecap="round"/>' : '';
  const mouth = o.mouth==='o' ? '<ellipse cx="100" cy="134" rx="7" ry="9" fill="#2a1d18"/>' : '<path d="M88 132 q12 10 24 0" stroke="#2a1d18" stroke-width="5" fill="none" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="${o.bg||'#FFF6E5'}"/>
  <g transform="translate(100 108) scale(${s}) translate(-100 -108)">
  ${[[60,60],[100,46],[140,60],[156,96],[146,138],[100,158],[54,138],[44,96]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${o.fat?34:30}" fill="${wool}" stroke="#E9E2D6" stroke-width="3"/>`).join('')}
  <ellipse cx="54" cy="96" rx="20" ry="11" fill="${face}" transform="rotate(-25 54 96)"/><ellipse cx="146" cy="96" rx="20" ry="11" fill="${face}" transform="rotate(25 146 96)"/>
  <ellipse cx="100" cy="112" rx="40" ry="44" fill="${face}"/>
  <circle cx="84" cy="106" r="11" fill="#fff"/><circle cx="116" cy="106" r="11" fill="#fff"/>
  <circle cx="${o.look?88:85}" cy="108" r="6" fill="#1a1a1a"/><circle cx="${o.look?120:117}" cy="108" r="6" fill="#1a1a1a"/>
  <circle cx="87" cy="105" r="2" fill="#fff"/><circle cx="119" cy="105" r="2" fill="#fff"/>
  ${brow}${blush}${mouth}
  ${[[78,70],[100,62],[122,70]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="16" fill="${wool}" stroke="#E9E2D6" stroke-width="3"/>`).join('')}
  ${acc}</g></svg>`;
}
function person(o){
  const skin=o.skin||'#E8B48A', robe=o.robe, cloth=o.cloth;
  let head='';
  if(o.veil) head=`<path d="M48 120 Q50 40 100 38 Q150 40 152 120 L152 190 L48 190 Z" fill="${cloth}"/>`;
  else if(cloth) head=`<path d="M56 96 Q58 46 100 44 Q142 46 144 96 Q120 80 100 82 Q80 80 56 96 Z" fill="${cloth}"/><rect x="56" y="78" width="88" height="12" rx="6" fill="${o.band||'#fff'}" opacity=".85"/>`;
  else head=`<path d="M60 92 Q64 52 100 52 Q136 52 140 92 Q120 74 100 76 Q80 74 60 92 Z" fill="${o.hair||'#5a3b22'}"/>`;
  const beard = o.beard ? `<path d="M70 120 Q74 168 100 170 Q126 168 130 120 Q118 140 100 140 Q82 140 70 120 Z" fill="${o.beard}"/>` : '';
  const wings = o.wings ? `<path d="M40 150 Q2 100 30 70 Q40 110 70 128 Z" fill="#fff" stroke="#E6E1F5" stroke-width="3"/><path d="M160 150 Q198 100 170 70 Q160 110 130 128 Z" fill="#fff" stroke="#E6E1F5" stroke-width="3"/>` : '';
  const halo = o.halo ? `<ellipse cx="100" cy="36" rx="30" ry="9" fill="none" stroke="#FFD23F" stroke-width="7"/>` : '';
  const prop = o.prop==='staff' ? `<path d="M168 200 L168 70 Q168 46 150 50" stroke="#7a4b23" stroke-width="9" fill="none" stroke-linecap="round"/>`
    : o.prop==='lantern' ? `<g transform="translate(160 132)"><path d="M0 -26 v8" stroke="#555" stroke-width="4"/><rect x="-14" y="-18" width="28" height="34" rx="6" fill="#FFD23F" stroke="#B8860B" stroke-width="4"/><circle cy="0" r="6" fill="#FF8F00"/></g>` : '';
  const blush = o.blush ? '<circle cx="78" cy="122" r="8" fill="#FF8FB1" opacity=".7"/><circle cx="122" cy="122" r="8" fill="#FF8FB1" opacity=".7"/>' : '';
  const sc = o.small ? 'translate(100 120) scale(.86) translate(-100 -120)' : '';
  return `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="${o.bg||'#F3F0FF'}"/>${wings}<g transform="${sc}">
  <path d="M38 200 Q42 150 100 146 Q158 150 162 200 Z" fill="${robe}"/>
  ${o.veil?head:''}
  <circle cx="100" cy="108" r="40" fill="${skin}"/>
  ${o.veil?'':head}${beard}
  <circle cx="86" cy="108" r="5" fill="#1a1a1a"/><circle cx="114" cy="108" r="5" fill="#1a1a1a"/>
  ${o.old?'<path d="M78 98 h14 M108 98 h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>':''}
  ${blush}<path d="M88 126 q12 9 24 0" stroke="#7a3b2b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  ${halo}</g>${prop}</svg>`;
}
function narrator(){
  return `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#ECEFF1"/>
  <path d="M40 70 l6 14 l15 2 l-11 10 l3 15 l-13 -8 l-13 8 l3 -15 l-11 -10 l15 -2z" fill="#FFD23F"/>
  <path d="M160 50 l4 10 l11 1 l-8 7 l2 11 l-9 -6 l-9 6 l2 -11 l-8 -7 l11 -1z" fill="#FFD23F"/>
  <path d="M40 150 h120 v20 Q100 186 40 170 Z" fill="#8D6E63"/><path d="M44 146 Q100 120 156 146 v8 Q100 132 44 154 Z" fill="#fff" stroke="#c8bfb0" stroke-width="3"/>
  <rect x="84" y="46" width="32" height="56" rx="16" fill="#546E7A"/><path d="M72 84 Q72 118 100 118 Q128 118 128 84" stroke="#37474F" stroke-width="7" fill="none"/>
  <path d="M100 118 v18" stroke="#37474F" stroke-width="7"/><g stroke="#90A4AE" stroke-width="3"><path d="M90 60h20M90 70h20M90 80h20"/></g></svg>`;
}
const AV = {
  'Embe': ()=>sheep({acc:'crown',brow:true,bg:'#FFF1D6'}),
  'Embi': ()=>sheep({acc:'bow',face:'#5D4637',bg:'#E0FAFC',blush:true}),
  'Bolu': ()=>sheep({fat:true,acc:'grass',face:'#6D4C41',bg:'#F3ECE8'}),
  'Cilik': ()=>sheep({small:true,blush:true,mouth:'o',bg:'#FFE6EF'}),
  'Pak Yakob': ()=>person({robe:'#8A5A2B',cloth:'#C98B4A',band:'#5a3a1a',beard:'#EDEDED',old:true,prop:'staff',bg:'#FBEBD7'}),
  'Timo': ()=>person({robe:'#1E7BE0',cloth:'#5AA5FF',band:'#0d4e9c',prop:'lantern',bg:'#E3F0FF'}),
  'Malaikat': ()=>person({robe:'#FFFFFF',hair:'#F2C14E',wings:true,halo:true,skin:'#F1C9A5',bg:'#FFF6CC'}),
  'Malaikat Kecil': ()=>person({robe:'#FFFFFF',hair:'#7b4a2a',wings:true,halo:true,small:true,blush:true,bg:'#EFE9FF'}),
  'Maria': ()=>person({robe:'#3949AB',veil:true,cloth:'#6F86FF',skin:'#E9BC94',blush:true,bg:'#E8ECFF'}),
  'Yusuf': ()=>person({robe:'#00897B',cloth:'#A1887F',band:'#5d4037',beard:'#5a3b22',bg:'#DDF5F1'}),
  'Narator': narrator,
};
const SV = {}; function avatar(r){ return SV[r] || (SV[r] = (AV[r]||narrator)()); }



const $=id=>document.getElementById(id), audio=$('audio'), list=$('list');
const title=s=>s.toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
function rolesOf(w){ w=w.trim(); if(/^semua$/i.test(w)) return ['SEMUA']; if(/^gembala$/i.test(w)) return ['Pak Yakob','Timo']; return w.split(/,|&/).map(x=>title(x.trim())).filter(Boolean); }
function bg(rs){
  if(!rs) return 'linear-gradient(160deg,#7E6BD6,#3E2F86)';
  if(rs[0]==='SEMUA') return 'linear-gradient(135deg,#FF5C8A,#FFB547 30%,#4CD3A5 55%,#4AA8FF 78%,#9B7BFF)';
  const cs=rs.map(r=>ROLES[r]||ROLES.Narator);
  return cs.length===1?`linear-gradient(160deg,${cs[0].c2},${cs[0].c})`:`linear-gradient(135deg,${cs.map(c=>c.c).join(',')})`;
}
let si=0, li=-1, els=[], userScroll=false;
const sec=()=>DATA[si], hasAudio=()=>!!sec().audio;

function render(){
  const s=sec();
  list.innerHTML='<div class="head">'+s.emoji+' '+s.title+(hasAudio()?'':'<div style="font-size:.6em;opacity:.8;margin-top:6px">Ketuk baris untuk lanjut</div>')+'</div>'+
    s.lines.map((l,i)=>{ const rs=rolesOf(l.who); const a=rs[0]==='SEMUA'?'Embe':rs[0];
      return `<div class="ln${l.skip&&s.audio?' skip':''}" data-i="${i}"><div class="av">${avatar(a)}</div><div><div class="who">${title(l.who)}${l.part?'<span class="part">♪ '+l.part+'</span>':''}${l.skip&&s.audio?'<span class="miss">tidak ada di rekaman</span>':''}</div><div class="tx">${l.text}</div></div></div>`; }).join('');
  els=[...list.querySelectorAll('.ln')];
  els.forEach(el=>el.onclick=()=>{ const i=+el.dataset.i; if(hasAudio()){ audio.currentTime=tOf(i); setCur(lineAt(tOf(i)),true); } else setCur(i,true); });
  list.scrollTop=0;
}
function center(smooth){ const el=els[li]; if(!el) { list.scrollTo({top:0,behavior:smooth?'smooth':'auto'}); return; }
  const top=el.offsetTop - list.clientHeight*0.42 + el.offsetHeight/2;
  autoScrolling=true; list.scrollTo({top,behavior:smooth?'smooth':'auto'}); clearTimeout(asT); asT=setTimeout(()=>autoScrolling=false,700); }
let autoScrolling=false, asT;
function setCur(i,force){
  if(i===li && !force) return;
  li=i; els.forEach((el,k)=>{ el.classList.toggle('cur',k===i); el.classList.toggle('done',k<i); });
  $('bg').style.background=bg(i>=0?rolesOf(sec().lines[i].who):null);
  center(true);
  if(!hasAudio()) $('prog').style.width=((i+1)/sec().lines.length*100)+'%';
}
function tOf(i){ const L=sec().lines; for(let k=i;k<L.length;k++) if(L[k].t!=null) return L[k].t+0.01; return audio.duration||0; }
function lineAt(t){ const L=sec().lines; let k=-1; for(let i=0;i<L.length;i++){ if(L[i].t==null) continue; if(L[i].t<=t+0.08) k=i; else break; } return k; }
function load(i, autoplay){
  si=(i+DATA.length)%DATA.length; const s=sec(); li=-2;
  $('title').textContent=`${si+1}/${DATA.length} · ${s.emoji} ${s.title}`;
  render();
  if(s.audio){ audio.src=s.audio; audio.load(); if(autoplay) audio.play().catch(()=>{}); } else { audio.pause(); audio.removeAttribute('src'); audio.load(); }
  $('play').textContent='▶'; $('prog').style.width='0'; setCur(-1,true);
}
let scT;
function nearest(){ const mid=list.scrollTop+list.clientHeight*0.42; let k=0,best=1e9;
  els.forEach((el,i)=>{ const d=Math.abs(el.offsetTop+el.offsetHeight/2-mid); if(d<best){best=d;k=i;} }); return k; }
function mark(i){ els.forEach((el,k)=>{ el.classList.toggle('cur',k===i); el.classList.toggle('done',k<i); }); $('bg').style.background=bg(i>=0?rolesOf(sec().lines[i].who):null); }
list.addEventListener('scroll',()=>{
  if(autoScrolling||!els.length) return;
  userScroll=true; const k=nearest(); mark(k);
  clearTimeout(scT); scT=setTimeout(()=>{
    userScroll=false; li=k;
    if(hasAudio()){ audio.currentTime=tOf(k); li=lineAt(tOf(k)); mark(li); }
    else $('prog').style.width=((k+1)/sec().lines.length*100)+'%';
    center(true);
  },220);
},{passive:true});
audio.ontimeupdate=()=>{ const s=sec(); if(!s.audio) return; const k=lineAt(audio.currentTime);
  if(k!==li && !userScroll) setCur(k);
  $('prog').style.width=(audio.currentTime/(audio.duration||s.duration||1)*100)+'%'; };
audio.onplay=()=>{ $('play').textContent='⏸'; center(true); };
audio.onpause=()=>$('play').textContent='▶';
audio.onended=()=>{ if(si<DATA.length-1) load(si+1,true); };
$('play').onclick=()=>{ if(!hasAudio()){ if(li<sec().lines.length-1) setCur(li+1,true); else load(si+1); return; } audio.paused?audio.play().catch(()=>{}):audio.pause(); };
$('prev').onclick=()=>load(si-1);
$('next').onclick=()=>load(si+1);
document.onkeydown=e=>{ if(e.code==='Space'){ e.preventDefault(); $('play').click(); } if(e.code==='ArrowRight') $('next').click(); if(e.code==='ArrowLeft') $('prev').click(); };
load(0);
</script>
</body>
</html>
