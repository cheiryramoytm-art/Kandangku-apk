name: Align subtitles
on:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/align.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q demucs faster-whisper soundfile
      - name: Align
        run: python tools/align_ci.py
      - name: Publish result
        run: |
          mkdir res && cp align_out.json res/ && cd res
          git init -q -b align
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add . && git commit -qm "align ${GITHUB_SHA::7}"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} align
