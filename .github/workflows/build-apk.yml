name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kandangku.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kandangku-APK
          path: Kandangku.apk
      - name: Publish APK to apk branch
        run: |
          mkdir out && cp Kandangku.apk out/ && cd out
          git init -q -b apk
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add Kandangku.apk && git commit -qm "APK build ${GITHUB_SHA::7}"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} apk
